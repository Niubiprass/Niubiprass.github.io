name: Sync from CI

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull debs from theos-ci
        run: |
          git clone --depth 1 https://github.com/Niubiprass/theos-ci.git /tmp/theos-ci
          mkdir -p debs
          cp -v /tmp/theos-ci/packages/*.deb debs/ 2>/dev/null || true

      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages
          gzip -kf Packages

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add debs Packages Packages.bz2 Packages.gz
          git commit -m "同步 CI 构建的 deb 并更新源索引" || true
          git push
